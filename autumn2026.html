        // ▲▲▲ 株価情報（四季報データ）を追加するのはここまで ▲▲▲

        const searchInput = document.getElementById('shikihoSearchInput');
        const resultsContainer = document.getElementById('shikihoSearchResults');
        const noResultMessage = document.getElementById('noResultMessage');
        const initialMessage = document.getElementById('initialMessage');

        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            resultsContainer.innerHTML = '';

            if (query.length === 0) {
                initialMessage.style.display = 'block';
                noResultMessage.style.display = 'none';
                return;
            }

            initialMessage.style.display = 'none';
            let matchCount = 0;

            shikihoData.forEach(item => {
                const searchTarget = `${item.code} ${item.name} ${item.industry} ${item.outline} ${item.evaluation}`.toLowerCase();
                
                if (searchTarget.includes(query)) {
                    matchCount++;
                    const cardHTML = `
                        <details class="stock-card" open style="border: 2px solid #2c7cbf;">
                            <summary class="stock-summary" style="background-color: #e2eef7;">${item.code} ${item.name}</summary>
                            <div class="stock-details">
                                <div class="table-responsive">
                                    <table class="data-table">
                                        <tr><th>業種</th><td>${item.industry}</td></tr>
                                        <tr><th>会社概要</th><td>${item.outline}</td></tr>
                                        <tr><th>四季報の評価</th><td>${item.evaluation}</td></tr>
                                        <tr><th>実績PER / PBR</th><td>${item.perPbr}</td></tr>
                                        <tr><th>配当利回り</th><td>${item.yield}</td></tr>
                                        <tr><th>業績予想<br>(売上高 / 純利益)</th><td>${item.forecast}</td></tr>
                                        <tr><th>自己資本比率 / ROE</th><td>${item.equityRoe}</td></tr>
                                    </table>
                                </div>
                            </div>
                        </details>
                    `;
                    resultsContainer.insertAdjacentHTML('beforeend', cardHTML);
                }
            });

            if (matchCount === 0) {
                noResultMessage.style.display = 'block';
            } else {
                noResultMessage.style.display = 'none';
            }
        });
    </script>
