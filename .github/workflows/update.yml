name: Auto Update Stock Prices

on:
  schedule:
    # 日本時間の朝8時（UTCの23時）に実行
    - cron: '0 23 * * *'
  workflow_dispatch: # 手動でテスト実行するためのボタン

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run update script
        run: python update_prices.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html
          # 変更があった場合のみ自動保存（コミット）する
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌅 朝の株価＆増減率自動更新" && git push)
