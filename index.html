<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仮タイトル：1億円投資家の四季報分析</title>
    <style>
        /* 全体の背景を少し温かみのある白に、文字を柔らかい濃いグレーに設定 */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f8fafc; color: #4a5568; margin: 0; padding: 0; line-height: 1.7; }
        
        /* ヘッダー：親しみやすく信頼感のある爽やかなブルー */
        header { background-color: #3182ce; color: white; padding: 40px 20px; text-align: center; border-bottom: 4px solid #2b6cb0; }
        h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        header p { margin-top: 10px; opacity: 0.9; font-size: 14px; }
        
        /* メインコンテンツの枠組み：角を丸くして柔らかさを演出 */
        .container { max-width: 800px; margin: -20px auto 40px; background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); position: relative; }
        
        /* 見出し：ブルーのアクセントと下線 */
        h2 { border-bottom: 2px dashed #90cdf4; padding-bottom: 10px; color: #2c5282; font-size: 22px; margin-top: 30px; }
        
        /* コンセプトボックス：薄いブルーで優しく強調 */
        .concept-box { background-color: #ebf8ff; padding: 20px; border-radius: 12px; border-left: 6px solid #4299e1; margin-bottom: 30px; font-size: 15px; }
    </style>
</head>
<body>
    <header>
        <h1>仮タイトル：1億円投資家の四季報分析</h1>
        <p>〜初心者でもわかる！高配当・低PER・増収増益の厳選銘柄〜</p>
    </header>
    
    <div class="container">
        <div class="concept-box">
            <p><strong>ようこそ！当サイトのコンセプト🔰</strong><br>
            個人資産1億円を築いた投資家が、全3,800銘柄から独自の基準でスクリーニングした「今月の厳選高配当バリュー株」を、初心者の方にもわかりやすくお届けします。</p>
        </div>
        
        <h2>最新の厳選銘柄リスト（準備中）</h2>
        <p>ここに、プログラムと四季報の読み込みを掛け合わせた、独自の厳選銘柄ダッシュボード（表）が表示される予定です。</p>
    </div>
</body>
</html>
