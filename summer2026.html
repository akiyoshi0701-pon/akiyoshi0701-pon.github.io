<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026四季報夏号 - 1億円投資家の四季報からの優しい高配当株選び</title>
    <style>
        /* 基本設定 */
        body { font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background-color: #f0f4f8; color: #333; margin: 0; padding: 0; line-height: 1.6; }
        
        /* ヘッダー（ホームと同じ背景画像設定） */
        header { 
            position: relative;
            background-image: url('IMG_0372.jpeg'); 
            background-size: cover;
            background-position: center;
            color: white; 
            padding: 50px 20px; 
            text-align: center; 
        }
        header::before {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background-color: rgba(26, 91, 146, 0.7);
            z-index: 1;
        }
        header h1, header p {
            position: relative;
            z-index: 2;
        }
        header h1 { margin: 0; font-size: 26px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); }
        header p { margin: 10px 0 0; font-size: 15px; opacity: 0.95; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }

        /* ナビゲーションメニュー（横スクロール対応） */
        nav { 
            background-color: #1a5b92; 
            display: flex; 
            justify-content: flex-start; 
            overflow-x: auto; 
            white-space: nowrap; 
            -webkit-overflow-scrolling: touch; 
        }
        nav::-webkit-scrollbar { display: none; }
        nav { -ms-overflow-style: none; scrollbar-width: none; }
        nav a { 
            color: white; 
            text-decoration: none; 
            padding: 15px 25px; 
            font-size: 15px; 
            transition: background-color 0.3s; 
            flex-shrink: 0; 
        }
        nav a:hover { background-color: #134674; }
        .active-nav { background-color: #134674; font-weight: bold; }
        
        /* レイアウト */
        .container { display: flex; flex-wrap: wrap; max-width: 1000px; margin: 20px auto; padding: 0 15px; gap: 20px; }
        .main-content { flex: 1 1 600px; }
        .sidebar { flex: 1 1 300px; }
        
        /* 四季報リスト用のアコーディオン装飾 */
        .page-title { background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border-left: 5px solid #ff9800; }
        .page-title h2 { margin: 0; color: #2c7cbf; font-size: 22px; }
        .page-title p { margin: 10px 0 0 0; color: #555; font-size: 14px; }
        .stock-list { display: flex; flex-direction: column; gap: 15px; }
        .stock-card { background-color: white; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e0e0e0; }
        .stock-summary { padding: 15px 20px; font-size: 18px; font-weight: bold; color: #1a5b92; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; background-color: #f9fbfd; transition: background-color 0.2s; }
        .stock-summary:hover { background-color: #f0f4f8; }
        .stock-summary::-webkit-details-marker { display: none; }
        .stock-summary::after { content: "▼ 開く"; font-size: 13px; color: #888; background-color: #fff; padding: 4px 10px; border-radius: 20px; border: 1px solid #ddd; white-space: nowrap; }
        .stock-card[open] .stock-summary::after { content: "▲ 閉じる"; background-color: #e2eef7; color: #1a5b92; border-color: #2c7cbf; }
        .stock-details { padding: 20px; border-top: 1px solid #eee; }
        
        /* テーブル装飾 */
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .data-table th, .data-table td { border: 1px solid #e0e0e0; padding: 12px; font-size: 14px; }
        .data-table th { background-color: #f4f7fa; width: 28%; text-align: left; color: #333; font-weight: bold; }
        .data-table td { background-color: #fff; color: #444; }
        .perf-table th { background-color: #e2eef7; text-align: center; }
        .perf-table td { text-align: center; }
        
        /* ハイライト色 */
        .highlight-red { color: #d32f2f; font-weight: bold; }
        .highlight-blue { color: #1976d2; font-weight: bold; }
        .price-current { font-size: 16px; font-weight: bold; color: #1976d2; }
        
        /* PRボタン */
        .pr-box { background-color: white; border: 2px solid #ffebd6; border-radius: 8px; padding: 15px; text-align: center; }
        .pr-label { font-size: 12px; color: #888; margin-bottom: 5px; }
        .pr-button { display: inline-block; background-color: #f39c12; color: white; text-decoration: none; font-weight: bold; padding: 15px 20px; border-radius: 6px; width: 90%; box-sizing: border-box; box-shadow: 0 3px 0 #d68910; }
        .pr-disclaimer { font-size: 11px; color: #999; margin-top: 10px; }

        /* スマホ対応 */
        @media (max-width: 600px) {
            header { padding: 30px 15px; }
            header h1 { font-size: 20px; word-break: keep-all; }
            header p { font-size: 13px; }
            .page-title h2 { font-size: 18px; }
            .stock-summary { font-size: 15px; padding: 12px 15px; }
            .data-table th, .data-table td { font-size: 12px; padding: 8px; }
            .data-table th { width: 35%; }
            .stock-details { padding: 10px; }
            .table-responsive { overflow-x: auto; white-space: nowrap; }
        }
    </style>
</head>
